<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fake-editor — embed protocol mock</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; padding: 12px; color: #1a1a1a; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    .hint { font-size: 12px; color: #666; margin: 0 0 12px; }
    .file { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin: 0 0 10px; }
    .file header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .file header .id { font-weight: 600; font-size: 13px; flex: 1; word-break: break-all; }
    .file header .close { cursor: pointer; border: none; background: #f3f3f3; border-radius: 4px; padding: 2px 8px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 90px; font-family: ui-monospace, monospace; font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; display: inline-block; }
    .dot.saving { background: #e0a800; }
    .dot.saved { background: #28a745; }
    .dot.error { background: #dc3545; }
    .promote { border: 1px dashed #aaa; border-radius: 6px; padding: 8px; margin-top: 16px; }
    .promote input { width: 200px; }
    button { cursor: pointer; }
    code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>fake-editor (protocol mock)</h1>
  <p class="hint">Emulates the <em>editor</em> side of the embed protocol. <code>data</code> is opaque text — no GPX parsing, no map, no Dexie. Parent origin: <code id="parentOrigin"></code></p>

  <div id="files"></div>

  <div class="promote">
    <strong>New local file → Save to server</strong><br />
    <label>name: <input id="newName" value="new-track.gpx" /></label>
    <button id="newSave">saveToHost</button>
    <p class="hint">Posts <code>{event:'saveToHost', tempId, data, name}</code>; host replies <code>assignId</code>.</p>
  </div>

  <script>
    // ---- Origin handling ---------------------------------------------------
    // The shell and editor are different origins. Allow configuring (and by
    // default trust) the parent that framed us. '*' is acceptable for the mock.
    const params = new URLSearchParams(location.search);
    const ALLOWED_PARENT = params.get('parentOrigin') || '*';
    document.getElementById('parentOrigin').textContent = ALLOWED_PARENT;

    function post(msg) {
      window.parent.postMessage(msg, ALLOWED_PARENT);
    }

    // ---- File rendering ----------------------------------------------------
    const filesEl = document.getElementById('files');
    const nodes = new Map(); // id -> { wrap, textarea, dot }
    const debounceTimers = new Map();
    let tempCounter = 0;

    function setDot(id, state) {
      const n = nodes.get(id);
      if (n) n.dot.className = 'dot ' + (state || '');
    }

    function renderFile(id, data, title) {
      let n = nodes.get(id);
      if (!n) {
        const wrap = document.createElement('div');
        wrap.className = 'file';
        const header = document.createElement('header');
        const dot = document.createElement('span');
        dot.className = 'dot';
        const label = document.createElement('span');
        label.className = 'id';
        const close = document.createElement('button');
        close.className = 'close';
        close.textContent = '×';
        close.title = 'tell host nothing — local close only';
        close.onclick = () => dropFile(id);
        const textarea = document.createElement('textarea');
        textarea.addEventListener('input', () => onEdit(id));
        header.append(dot, label, close);
        wrap.append(header, textarea);
        filesEl.append(wrap);
        n = { wrap, textarea, dot, label };
        nodes.set(id, n);
      }
      n.label.textContent = title ? `${title}  (${id})` : id;
      n.textarea.value = data ?? '';
    }

    function dropFile(id) {
      const n = nodes.get(id);
      if (n) { n.wrap.remove(); nodes.delete(id); }
    }

    function onEdit(id) {
      setDot(id, 'saving');
      clearTimeout(debounceTimers.get(id));
      debounceTimers.set(id, setTimeout(() => {
        post({ event: 'autosave', id, data: nodes.get(id).textarea.value });
      }, 400));
    }

    // ---- Promotion ---------------------------------------------------------
    document.getElementById('newSave').onclick = () => {
      const tempId = 'temp-' + (++tempCounter);
      const name = document.getElementById('newName').value || 'untitled.gpx';
      // Render it locally so the assigned id can rebind onto it.
      renderFile(tempId, `<!-- new local file: ${name} -->\n`, name + ' (local)');
      setDot(tempId, 'saving');
      post({ event: 'saveToHost', tempId, data: nodes.get(tempId).textarea.value, name });
    };

    // ---- Inbound (host → editor) ------------------------------------------
    window.addEventListener('message', (e) => {
      if (ALLOWED_PARENT !== '*' && e.origin !== ALLOWED_PARENT) return;
      const m = e.data || {};
      switch (m.action) {
        case 'load':
          renderFile(m.id, m.data, m.title);
          setDot(m.id, 'saved'); // freshly loaded == in sync with host
          post({ event: 'load', id: m.id }); // ack
          break;
        case 'merge':
          // whole-file replace from a collaborator
          renderFile(m.id, m.data);
          setDot(m.id, 'saved');
          break;
        case 'remove':
          dropFile(m.id);
          break;
        case 'status':
          setDot(m.id, m.ok ? 'saved' : 'error');
          break;
        case 'assignId': {
          // rebind temp local file to its new host id
          const n = nodes.get(m.tempId);
          if (n) {
            nodes.delete(m.tempId);
            nodes.set(m.id, n);
            n.label.textContent = m.id;
          }
          setDot(m.id, 'saved');
          break;
        }
      }
    });

    // ---- Handshake ---------------------------------------------------------
    post({ event: 'init' });
  </script>
</body>
</html>
