<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fake-host — minimal embed host</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    .bar { padding: 8px 12px; background: #1f2933; color: #fff; display: flex; gap: 8px; align-items: center; }
    .bar input { flex: 1; }
    iframe { border: 0; width: 100%; height: 100%; }
    #log { position: fixed; bottom: 0; right: 0; width: 380px; max-height: 40vh; overflow: auto;
           background: #000a; color: #0f0; font: 11px ui-monospace, monospace; padding: 6px; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>fake-host</strong>
    <label>iframe src: <input id="src" size="40" /></label>
    <button id="go">load iframe</button>
    <button id="send">post load</button>
  </div>
  <iframe id="editor"></iframe>
  <pre id="log"></pre>

  <script>
    // Minimal mirror of the host: frames the real editor, posts one `load`,
    // and logs whatever the editor emits. Used to build editor embed mode
    // (M5+) without the full shell/backend.
    const params = new URLSearchParams(location.search);
    const DEFAULT_SRC = params.get('src') || 'http://localhost:5180/app?embedded=1';
    const srcInput = document.getElementById('src');
    srcInput.value = DEFAULT_SRC;

    const iframe = document.getElementById('editor');
    const logEl = document.getElementById('log');
    function log(dir, obj) {
      logEl.textContent += `${dir} ${JSON.stringify(obj)}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    const SAMPLE = `<?xml version="1.0"?>\n<gpx version="1.1" creator="fake-host">\n  <trk><name>Sample</name><trkseg>\n    <trkpt lat="46.5" lon="6.6"/><trkpt lat="46.51" lon="6.61"/>\n  </trkseg></trk>\n</gpx>`;

    function editorWindow() { return iframe.contentWindow; }
    function postToEditor(msg) { log('→', msg); editorWindow().postMessage(msg, '*'); }

    document.getElementById('go').onclick = () => { iframe.src = srcInput.value; };
    document.getElementById('send').onclick = () =>
      postToEditor({ action: 'load', id: 'sample.gpx', data: SAMPLE, title: 'Sample', autosave: 1 });

    window.addEventListener('message', (e) => {
      const m = e.data || {};
      if (!m.event && !m.action) return; // ignore vite/devtools noise
      log('←', m);
      if (m.event === 'init') {
        // auto-load once the editor announces itself
        postToEditor({ action: 'load', id: 'sample.gpx', data: SAMPLE, title: 'Sample', autosave: 1 });
      }
      if (m.event === 'autosave' || m.event === 'save') {
        // ack the write so the editor's status badge can flip to "Saved"
        postToEditor({ action: 'saved', id: m.id, version: Date.now() });
      }
      if (m.event === 'saveToHost') {
        const id = m.name || 'promoted.gpx';
        postToEditor({ action: 'assignId', tempId: m.tempId, id });
        postToEditor({ action: 'saved', id, version: Date.now() });
      }
    });

    iframe.src = DEFAULT_SRC;
  </script>
</body>
</html>
